<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Finder</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">


    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="#">
                🎓 University Finder
            </a>
        </div>
    </nav>



    <!-- Hero Section -->
    <section class="py-5">

        <div class="container ">

            <div class="row justify-content-center">

                <div class="col-md-8 text-center">

                    <h1 class="display-5 fw-bold mb-3">
                        Find Universities Worldwide
                    </h1>

                    <p class="text-muted fs-5">
                        Search universities by country and explore
                        institutions around the world.
                    </p>


                    <!-- Search Card -->
                    <div class="card shadow border-0 p-4 mt-4">

                        <h3 class="mb-4">
                            Search University
                        </h3>


                        <div class="input-group">

                            <input 
                                class="form-control"
                                placeholder="Enter country"
                            >
                            &nbsp;&nbsp;&nbsp;
                            <button class="btn btn-primary px-4" style="border-radius: 5px;">
                                Search
                            </button>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </section>



    <!-- Result Section -->
    <section class="pb-5">

        <div class="container">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        Universities List
                    </h4>
                </div>


                <div class="card-body ml-4 pl-4" style="padding-left: 50px;">

                    <ul id="list" class="list-group">
                        <!-- Universities will appear here -->
                    </ul>

                </div>

            </div>

        </div>

    </section>



    <br><br><br><br><br>
    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 ">

        <p class="mb-0">
            © 2026 University Finder
        </p>

    </footer>



    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Your JS -->
    <script src="app.js"></script>

</body>
</html>
